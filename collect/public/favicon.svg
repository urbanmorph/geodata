  <g transform="translate(-4 -2)"><path d="M 22 13 L 22 51 L 28 51 L 28 47 Q 31 52 38 52 Q 50 52 50 38 Q 50 24 38 24 Q 31 24 28 29 L 28 13 Z M 36 30 Q 44 30 44 38 Q 44 46 36 46 Q 28 46 28 38 Q 28 30 36 30 Z" fill="#ffffff" fill-rule="evenodd"/></g>
  <!-- map-pin badge: collect is where you drop points; cut out of the b with an indigo ring -->
  <circle cx="49" cy="47" r="13" fill="#6366f1"/>
  <circle cx="49" cy="47" r="10.5" fill="#ffffff"/>
  <path transform="translate(49 46)" d="M 0 8 C -2 5 -5.5 2 -5.5 -2 A 5.5 5.5 0 1 1 5.5 -2 C 5.5 2 2 5 0 8 Z M 0 -4 A 2 2 0 1 0 0.01 -4 Z" fill="#6366f1" fill-rule="evenodd"/>
