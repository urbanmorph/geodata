name: python tests

# The data pipeline's tests (scripts/test_*.py) and the D1 migration check.
# Nothing here touches R2 or D1: the tests use local files and fakes.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'web/migrations/**'
      - '.github/workflows/python-tests.yml'
      - '.flake8'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'web/migrations/**'
      - '.github/workflows/python-tests.yml'
      - '.flake8'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: install GDAL and tippecanoe
        # Ubuntu mirrors answer 503 now and then: retry each fetch, and the whole step three times.
        run: |
          for try in 1 2 3; do
            timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq &&
              timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq gdal-bin tippecanoe && exit 0
            echo "apt failed (try $try); retrying in 30 s"; sleep 30
          done
          exit 1

      - name: install Python packages
        run: python3 -m pip install --quiet 'duckdb==1.5.2' boto3 pyarrow pytest fonttools flake8

      - name: lint
        run: python3 -m flake8 scripts  # config: .flake8

      - name: tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python3 -m pytest scripts -q -p no:cacheprovider

      - name: D1 migrations apply cleanly
        run: python3 scripts/verify_migrations.py
