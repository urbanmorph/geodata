name: collect

# Separate from ci.yml (which builds/deploys the geodata/web project) so a
# collect change never rebuilds web and vice versa — the deploy isolation the
# subdomain exists for. Path-filtered to collect's own tree, plus the web/
# files it imports.
on:
  push:
    branches: [main]
    paths:
      - 'collect/**'
      - 'shared/**'
      - '.github/workflows/collect.yml'
      # web/ files collect imports (collect/tests/workflow-paths.test.ts keeps this list complete)
      - 'web/functions/lib/api-ratelimit.ts'
      - 'web/functions/lib/attempt-log.ts'
      - 'web/functions/lib/crypto.ts'
      - 'web/functions/lib/licenses.ts'
      - 'web/functions/lib/persist-submission.ts'
      - 'web/functions/lib/submissions.ts'
      - 'web/functions/lib/submissions-sql.ts'
      - 'web/functions/lib/submit-helpers.ts'
      - 'web/functions/lib/tokens.ts'
      - 'web/functions/lib/turnstile.ts'
      - 'web/scripts/shared-chrome.mjs'
      - 'web/src/install-button.ts'
      - 'web/src/util.ts'
      - 'web/tests/helpers/manifest-checks.ts'
  pull_request:
    branches: [main]
    paths:
      - 'collect/**'
      - 'shared/**'
      - '.github/workflows/collect.yml'
      # web/ files collect imports (collect/tests/workflow-paths.test.ts keeps this list complete)
      - 'web/functions/lib/api-ratelimit.ts'
      - 'web/functions/lib/attempt-log.ts'
      - 'web/functions/lib/crypto.ts'
      - 'web/functions/lib/licenses.ts'
      - 'web/functions/lib/persist-submission.ts'
      - 'web/functions/lib/submissions.ts'
      - 'web/functions/lib/submissions-sql.ts'
      - 'web/functions/lib/submit-helpers.ts'
      - 'web/functions/lib/tokens.ts'
      - 'web/functions/lib/turnstile.ts'
      - 'web/scripts/shared-chrome.mjs'
      - 'web/src/install-button.ts'
      - 'web/src/util.ts'
      - 'web/tests/helpers/manifest-checks.ts'
  workflow_dispatch:

# The GITHUB_TOKEN only reads the repo: deploys use the Cloudflare token.
permissions:
  contents: read

# One run at a time per branch: two merges close together otherwise deploy in
# parallel and the older build can finish last (web/tests/deploy-order.test.ts).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collect
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: collect/package-lock.json

      - name: install
        run: npm ci

      - name: build (vitest + typecheck + vite)
        env:
          # Public sitekey; the default is the live collect widget key.
          VITE_TURNSTILE_SITEKEY: ${{ secrets.COLLECT_TURNSTILE_SITEKEY || '0x4AAAAAAEUVQ4gS3xN4W2l1' }}
          # ArcGIS Location Platform key for the satellite basemap (shared/esri-imagery.ts).
          # Without it (e.g. a fork's PR) the build simply offers no satellite option.
          VITE_ARCGIS_KEY: ${{ secrets.VITE_ARCGIS_KEY }}
        run: npm run build

      # Deploy only on push-to-main / manual. PRs build but don't deploy.
      - name: deploy to cloudflare pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # wrangler is not in the lockfile: pin it, so a new release never deploys untested.
        run: npx --yes wrangler@4.165.0 pages deploy dist --project-name=collect --branch=main
