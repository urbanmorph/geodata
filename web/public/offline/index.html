<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>You're offline · bharatlas</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Shown with no network, so it carries copies of the tokens it needs
     (shared/tokens.mjs; web/tests/design-tokens.test.ts keeps them equal). */
  :root{color-scheme:light dark;--font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;--fs-base: 15px;--fs-md: 16px;--fs-xl: 22px;--fs-3xl: 32px;--sp-2: 8px;--sp-3: 12px;--sp-5: 20px;--sp-6: 24px;--radius-sm: 4px;--border-edge: 1.5px solid var(--edge);--border-focus: 2px solid var(--accent-strong);--shadow-sm: 3px 3px 0 var(--edge);--bg: #F3F6F1;--bg-elevated: #ffffff;--fg: #0B1B3F;--muted: #4B5563;--edge: #0B1B3F;--accent-strong: #0B1B3F;--accent-fill: #F28C28;--on-accent-fill: #0B1B3F;--land: #E6F2EA}
  @media (prefers-color-scheme: dark){:root{--bg: #0a0a0a;--bg-elevated: #15151a;--fg: #ededed;--muted: #9ca3af;--edge: #C8D0E3;--accent-strong: #F28C28;--land: #13261C}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
    font:var(--fs-base)/1.6 var(--font-sans);
    padding:max(var(--sp-6),env(safe-area-inset-top)) max(var(--sp-5),env(safe-area-inset-right)) max(var(--sp-6),env(safe-area-inset-bottom)) max(var(--sp-5),env(safe-area-inset-left))}
  main{max-width:32rem;text-align:center}
  .site-brand{display:inline-flex;align-items:center;gap:var(--sp-2);color:var(--fg);text-decoration:none;font-size:var(--fs-xl);font-weight:800;letter-spacing:-.025em}
  h1{font-size:var(--fs-3xl);line-height:1.15;font-weight:800;letter-spacing:-.025em;margin:28px 0 var(--sp-2)}
  p{color:var(--muted);font-size:var(--fs-md);margin:0 0 var(--sp-6)}
  .links{display:flex;gap:var(--sp-3);justify-content:center;flex-wrap:wrap}
  .links a{display:inline-flex;align-items:center;min-height:44px;padding:0 var(--sp-5);border-radius:var(--radius-sm);border:var(--border-edge);background:var(--bg-elevated);color:var(--fg);text-decoration:none;font-size:var(--fs-md);font-weight:750}
  .links a:hover{background:var(--land)}
  .links a.go{background:var(--accent-fill);color:var(--on-accent-fill);box-shadow:var(--shadow-sm)}
  .links a:focus-visible{outline:var(--border-focus);outline-offset:2px}
</style>
</head>
<body>
<main>
  <a class="site-brand" href="/"><svg class="brand-mark" width="28" height="28" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path d="M20 22 L36 30 L20 38 L4 30 Z" fill="#12804A"/><path d="M20 14 L36 22 L20 30 L4 22 Z" fill="#FFFFFF" stroke="#0B1B3F" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 4 L36 12 L20 20 L4 12 Z" fill="#F28C28"/></svg><span class="brand-name">bharatlas</span></a>
  <h1>You're offline</h1>
  <p>bharatlas needs a connection: its maps and datasets load from the internet. Try again when you're back online.</p>
  <div class="links"><a class="go" href="">Try again</a><a href="/">Home</a></div>
</main>
</body>
</html>
