<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- SEO_HEAD -->
    <!-- HEAD_ICONS -->
    <!-- ?q=… opens every section before first paint (no layout shift). -->
    <script src="/q-precheck.js"></script>
    <style>
      <!-- TOKENS -->

      /* All layers: an index beside three realms, each with a section per theme. */
      .layers-head { margin: var(--sp-6) 0 var(--sp-5); }
      .layers-search {
        display: flex; align-items: center; gap: var(--sp-2-5); max-width: 640px; min-height: 52px; margin: 0 0 var(--sp-2); padding: 0 var(--sp-3-5);
        background: var(--bg-elevated); border: var(--border-strong); border-radius: var(--radius-sm); box-shadow: var(--shadow);
      }
      .layers-search:focus-within { outline: var(--border-focus); outline-offset: 2px; box-shadow: var(--shadow), var(--shadow-halo); }
      .search-meta { margin: var(--sp-2) 0 0; }
      .layers-body { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; align-items: start; margin-top: 28px; }
      .theme-index { position: sticky; top: calc(var(--header-h) + 16px); max-height: calc(100vh - var(--header-h) - 32px); overflow-y: auto; display: flex; flex-direction: column; border: var(--border-edge); background: var(--bg-elevated); }
      .theme-index__group + .theme-index__group { border-top: var(--border-edge); }
      /* Desktop, with JS and no search: every realm, but only the themes of the one in view (layers.ts). */
      @media (min-width: 901px) { .theme-index.is-following .theme-index__group:not(.is-active) a:not(.theme-index__realm) { display: none; } }
      .theme-index a.theme-index__realm { grid-template-columns: 1fr auto; font-weight: 800; background: var(--land); }
      .theme-index a {
        display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--sp-2-5); min-height: 44px; padding: var(--sp-1-5) var(--sp-3);
        color: var(--fg); font-weight: 650; text-decoration: none; border-bottom: var(--border-line);
      }
      .theme-index a:last-child { border-bottom: 0; }
      .theme-index a:hover { background: var(--land); }
      .theme-index__n { font: 600 var(--fs-xs) var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
      /* While filtering: a theme with no matching layer (its section is hidden). */
      .theme-index a.is-empty { opacity: .45; pointer-events: none; }
      @media (max-width: 900px) {
        /* Phones and tablets: the index becomes a row of chips that scrolls sideways. */
        .layers-body { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
        .theme-index { position: static; max-height: none; flex-direction: row; overflow-x: auto; scrollbar-width: none; border: 0; background: none; gap: var(--sp-2); }
        .theme-index__group { display: contents; }
        .theme-index a { flex: none; border: var(--border-edge); background: var(--bg-elevated); border-radius: var(--radius-sm); }
        .theme-index a:last-child { border-bottom: var(--border-edge); }
        /* A realm reads as a label before its themes' chips. */
        .theme-index a.theme-index__realm { border-color: transparent; background: none; padding-left: var(--sp-1); }
        .theme-index__group + .theme-index__group .theme-index__realm { margin-left: var(--sp-3); }
      }
      /* Realms: below ground, on the ground, in the air. A realm heading sits a level above its themes. */
      .realm { padding: 0 0 36px; scroll-margin-top: 16px; }
      .realm + .realm { padding-top: 28px; border-top: 3px solid var(--edge); }
      .realm__head { margin: 0 0 var(--sp-4-5); }
      .realm__title { margin: 0; font-size: var(--fs-3xl); line-height: 1.1; font-weight: 850; letter-spacing: -.025em; color: var(--fg); }
      .realm__desc { margin: var(--sp-1-5) 0 0; max-width: 640px; color: var(--muted); font-size: var(--fs-md); }
      .sister-card {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-3) var(--sp-5); margin: var(--sp-2) 0 0; padding: var(--sp-4) var(--sp-4-5);
        background: var(--bg-elevated); border: var(--border-edge); border-left: 4px solid var(--brand-green); border-radius: var(--radius-sm);
      }
      .sister-card p { margin: 0; max-width: 520px; }

      .catalog-empty { color: var(--muted); font-size: var(--fs-base); text-align: center; padding: var(--sp-7) 0; }
      .catalog-empty a { margin-left: var(--sp-1); }
      /* "clear the search": a button that reads as a link, with a 44 px hit area. */
      .link-btn { font: inherit; color: var(--accent); background: none; border: 0; padding: 11px 0; margin: -11px 0; text-decoration: underline; cursor: pointer; }

      .catalog { margin-top: var(--sp-2); }
      .category-section { padding: var(--sp-1) 0 28px; scroll-margin-top: 16px; }
      /* A rule only after a visible section, so a search that hides a realm's first theme leaves none on top. */
      .category-section:not(.hidden) ~ .category-section { padding-top: var(--sp-6); border-top: var(--border-edge); }
      .category-section.hidden { display: none; }
      .category-section__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin: 0 0 var(--sp-3); }
      .category-section__title { margin: 0; font-size: var(--fs-xl); font-weight: 800; letter-spacing: -.015em; color: var(--fg); scroll-margin-top: 16px; }
      @media (max-width: 640px) {
        .realm__title { font-size: var(--fs-2xl); }
        .category-section__title { font-size: var(--fs-lg); }
      }
      .category-section__count { color: var(--muted); font: 600 var(--fs-sm) var(--font-mono); font-variant-numeric: tabular-nums; }
      .category-section__body { display: flex; flex-direction: column; }
      .category-cta {
        display: inline-block; margin-top: var(--sp-3-5);
        padding: var(--sp-1-5) var(--sp-3-5);
        color: var(--muted); font-size: var(--fs-xs);
        text-decoration: none;
        border: var(--border-dashed); border-radius: var(--radius-pill);
        transition: color var(--dur-fast) ease, border-color var(--dur-fast) ease;
      }
      .category-cta:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }

      .comm-card { background: var(--bg-elevated); border: var(--border-edge); border-left-width: 4px; border-left-color: var(--accent-fill); padding: var(--sp-3-5) var(--sp-4); border-radius: var(--radius-sm); margin: var(--sp-2-5) 0; }
      .comm-card.hidden { display: none; }
      .comm-card__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2-5); flex-wrap: wrap; }
      .comm-card__title { font-weight: 600; font-size: var(--fs-base); }
      .comm-card__title a { color: inherit; text-decoration: none; }
      .comm-card__title a:hover { color: var(--accent); }
      .comm-card__score { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); font-size: var(--fs-sm); }
      .comm-card__score .useful { color: var(--accent-strong); }
      .comm-card__desc { color: var(--muted); font-size: var(--fs-sm); margin: var(--sp-1-5) 0 var(--sp-2); }
      .comm-card__meta { color: var(--muted); font-size: var(--fs-xs); }
      .comm-card__actions { display: flex; gap: var(--sp-4); margin-top: var(--sp-2-5); flex-wrap: wrap; align-items: center; }
      .comm-card__actions .btn { font-size: var(--fs-sm); padding: var(--sp-1-5) var(--sp-3); }
      .comm-card__dl .size { color: var(--muted); margin-left: var(--sp-1-5); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }

      /* row--collapsed: hidden by default; section's .expanded class reveals.
         Search/filter then hides non-matches with .row.hidden — bumped to
         .category-section .row.hidden so it matches the expanded rule's
         (0,3,0) specificity, and placed after it so source-order also
         tips ties its way. Without this, collapsed rows below the cap
         stay visible when search expands their section. */
      .row__updated { color: var(--muted); font-size: var(--fs-sm); margin: var(--sp-1) 0 0; }
      .row__updated time { font-variant-numeric: tabular-nums; }
      .row--collapsed { display: none; }
      .category-section.expanded .row--collapsed { display: block; }
      .category-section .row.hidden { display: none; }
      /* Pre-paint the expanded state when the URL has ?q=… so main.ts's
         apply() doesn't have to mutate every section after first paint
         (was the CLS source attributed to .category-section.expanded).
         /q-precheck.js sets html.has-query before paint. */
      html.has-query .row--collapsed { display: block; }

      .row {
        padding: var(--sp-1) 0;
        border-bottom: var(--border-line);
      }
      .row:last-child { border-bottom: none; }

      /* === Compact list layout (Option B) =========================== */
      .row--compact .row__details { width: 100%; min-width: 0; }
      /* row__head is the outer grid: details (title/source/count + expand) on
         the left, actions on the right. row__actions used to live inside
         <summary> but that violated HTML semantics (interactive descendants
         of an interactive element). Moving actions out of <summary> fixes
         the a11y issue without changing the visual layout. */
      .row--compact .row__head {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: var(--sp-3-5);
      }
      .row--compact .row__summary {
        display: grid;
        /* Title flexes (1fr) — downloads moved into row__expand so we no
           longer compete for horizontal space in the action column. Source
           is fixed-width to keep it aligned across rows; count is wide
           enough for the longest unit text ("community-development blocks").
           Actions (now just the View map button) sits in the row__head
           grid as a sibling. */
        grid-template-columns: minmax(0, 1fr) 80px 240px;
        align-items: baseline;
        gap: var(--sp-3-5);
        padding: var(--sp-2-5) var(--sp-1);
        font-size: var(--fs-sm);
        cursor: pointer;
      }
      .row--compact .row__summary::-webkit-details-marker { display: none; }
      .row--compact .row__summary:hover { background: var(--bg-card); }
      /* Two lines, so the year or source that tells sibling layers apart stays visible. */
      .row--compact .row__summary > .row__title { overflow: hidden; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .row--compact .row__summary > .row__source { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* display: block so text-overflow ellipsis applies to the combined
         num + unit text flow (spans inside default to inline; inline elems
         ignore overflow:hidden + text-overflow:ellipsis). */
      .row--compact .row__summary > .row__count { display: block; color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .row--compact .row__summary > .row__count .row__num { font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 500; margin-right: var(--sp-1-5); }
      @media (min-width: 641px) { .row--compact .row__summary > .row__count .row__num { display: inline-block; min-width: 6ch; text-align: right; } }
      .row--compact .row__head > .row__actions { gap: var(--sp-2-5); min-width: 0; padding: var(--sp-2-5) var(--sp-1); }
      /* Download links live inside row__expand (under "Download:") instead
         of the action column — frees horizontal space for the title. */
      .row--compact .row__expand .row__downloads { font-size: var(--fs-sm); margin: 0 0 var(--sp-2); color: var(--muted); }
      .row--compact .row__expand .row__downloads .dl-inline { --dl-gap: var(--sp-1-5); gap: var(--dl-gap); align-items: baseline; flex-wrap: wrap; }
      .row--compact .row__expand .row__downloads .dl-inline a { font-weight: 500; }
      .row--compact .row__expand {
        padding: var(--sp-2-5) var(--sp-1) var(--sp-3-5);
        border-top: var(--border-dashed);
        margin-top: var(--sp-1);
      }
      .row--compact .row__expand .row__desc { margin: 0 0 var(--sp-2); }
      .row--compact .row__lic-line { font-size: var(--fs-xs); color: var(--muted); margin: 0 0 var(--sp-1-5); }
      .row--compact .row__lic-line code { font-size: var(--fs-xs); }

      /* Tablet: drop source column, count keeps room. Downloads are already
         in row__expand so nothing to hide in the action area. */
      @media (max-width: 900px) {
        .row--compact .row__summary {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: var(--sp-2-5);
        }
        .row--compact .row__summary > .row__source { display: none; }
      }

      /* Mobile: title + count + View map. Tighter type and padding. */
      @media (max-width: 640px) {
        .row--compact .row__summary {
          gap: var(--sp-1-5) var(--sp-2-5);
          font-size: var(--fs-xs);
          padding: var(--sp-2) var(--sp-1);
        }
        .row--compact .row__head { gap: var(--sp-2); }
      }

      /* Very narrow: count drops to its own row so View map keeps room */
      @media (max-width: 420px) {
        .row--compact .row__summary {
          grid-template-columns: minmax(0, 1fr);
        }
        .row--compact .row__summary > .row__count {
          grid-column: 1;
          padding-top: var(--sp-0-5);
        }
      }

      /* "show all N" toggle at the bottom of a dense category */
      .show-more {
        display: block;
        width: 100%;
        margin: var(--sp-2-5) 0 0;
        padding: var(--sp-2) var(--sp-3);
        background: transparent;
        border: var(--border-dashed);
        border-radius: var(--radius-md);
        color: var(--muted);
        font: inherit;
        font-size: var(--fs-xs);
        cursor: pointer;
        transition: color var(--dur-fast) ease, border-color var(--dur-fast) ease;
      }
      .show-more:hover { color: var(--accent); border-color: var(--accent); }
      .category-section.expanded .show-more { display: none; }
      .row__head { margin-bottom: var(--sp-1-5); }
      .row__title {
        font-size: var(--fs-md);
        font-weight: 600;
        letter-spacing: -.005em;
        color: var(--fg);
      }
      .row__desc { color: var(--muted); font-size: var(--fs-sm); margin: 0 0 var(--sp-1-5); max-width: 640px; line-height: 1.5; }
      .row__source { color: var(--muted); font-size: var(--fs-xs); margin: 0 0 var(--sp-2-5); }
      .row__source a { color: var(--fg); }
      .row__source .dot { color: var(--line); }
      /* Alternative sources for the same level. Signals plurality without
         claiming any single source as canonical. Lighter than the primary
         attribution; lifts on hover so they read as clickable. */
      .row__alts { color: var(--muted); }
      .row__alts a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
      .row__alts a:hover { color: var(--accent); }
      .badge--community { margin-left: var(--sp-1); background: color-mix(in srgb, var(--accent-fill) 22%, var(--bg-elevated)); }
      .row__actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
      }
      /* View map: the shared line button (.btn .btn--line), sized for a row.
         Outlined: a column of solid buttons outweighs the layers they open. */
      .btn-primary {
        display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--sp-3-5);
        font-size: var(--fs-sm); font-weight: 650;
        white-space: nowrap;
      }
      /* Opens a map that downloads one large file (shared/large-load.mjs): warning edge + hourglass. */
      .btn-primary--large { gap: var(--sp-1-5); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--bg-elevated)); }
      .btn-primary--large .large-icon { flex: none; color: var(--warn); }
      .link--large { white-space: nowrap; }
      .link--large .large-icon { width: 14px; height: 14px; margin-right: 3px; vertical-align: -2px; color: var(--warn); }
      .btn-primary.disabled { background: transparent; color: var(--muted); border: var(--border-dashed); cursor: not-allowed; }

      .dl-inline { --dl-gap: var(--sp-4); display: inline-flex; gap: var(--dl-gap); align-items: center; font-size: var(--fs-sm); color: var(--muted); }
      .dl-inline a { color: var(--fg); display: inline-flex; align-items: center; min-height: 44px; padding: var(--sp-2-5) var(--sp-1); }
      .dl-inline .size { color: var(--muted); font-variant-numeric: tabular-nums; font-size: var(--fs-xs); margin-left: var(--sp-0-5); }
      /* The separator between formats, drawn here so no row carries it; the '' alt text keeps it out of the link's name. */
      .dl-inline > a:not(:first-child)::before { content: '·' / ''; display: inline-block; color: var(--line); margin-right: var(--dl-gap); }
      .dl-inline .count {
        font-variant-numeric: tabular-nums;
        font-size: var(--fs-xs);
        padding: 1px 5px;
        margin-left: var(--sp-1);
        border-radius: var(--radius-pill);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        color: var(--accent);
        cursor: help;
      }
      .row__viewer-hint {
        margin: var(--sp-2) 0 0;
        padding-left: var(--sp-1);
        font-size: var(--fs-xs);
        color: var(--muted);
        line-height: 1.5;
      }
      .row__viewer-hint strong { color: var(--fg); font-weight: 500; }
      .row__source a, .row__downloads a { text-decoration: none; }

      details.alt { margin-top: var(--sp-2-5); font-size: var(--fs-xs); }
      details.alt > summary {
        list-style: none;
        cursor: pointer;
        color: var(--muted);
        user-select: none;
        padding: var(--sp-0-5) 0;
      }
      details.alt > summary::-webkit-details-marker { display: none; }
      details.alt > summary::before { content: "⤳ "; opacity: .6; }
      details.alt[open] > summary::before { content: "⤴ "; }
      .alt__list { margin-top: var(--sp-2); padding-left: var(--sp-4); display: flex; flex-direction: column; gap: 5px; font-size: var(--fs-xs); }
      .alt__row { display: flex; gap: var(--sp-2-5); flex-wrap: wrap; align-items: baseline; }
      .alt__row .src { font-weight: 500; color: var(--fg); min-width: 80px; }
      .alt__row .meta, .alt__row .links { color: var(--muted); }
      .alt__row .links a { color: var(--fg); }
      .alt__row .links .dot { color: var(--line); margin: 0 var(--sp-1); }
      .alt__row--primary { padding-bottom: var(--sp-1-5); border-bottom: var(--border-dashed); margin-bottom: var(--sp-1); }
      .alt__row .tag { font-size: var(--fs-xs); padding: 1px var(--sp-1-5); background: var(--accent-fill); color: var(--on-accent-fill); border-radius: var(--radius-pill); margin-left: var(--sp-1); vertical-align: middle; letter-spacing: .04em; }
      /* Site-wide use (scripts/usage-totals.mjs): downloads, and API queries once past the threshold. */
      .usage-block { list-style: none; margin: 0 0 var(--sp-3-5); padding: 0; display: flex; flex-wrap: wrap; gap: var(--sp-1-5) 22px; }
      .usage-block__item { display: flex; align-items: baseline; gap: var(--sp-1-5); color: var(--muted); font-size: var(--fs-sm); }
      .usage-block__item strong { color: var(--brand-green); font: 700 var(--fs-lg) var(--font-mono); }
      .usage-block__item small { font-size: var(--fs-xs); }

    </style>
  </head>
  <body class="page">
    <!-- NAV -->
    <main id="main">
      <div class="layers-head">
        <p class="sheet-note"><!-- LAYER_TOTAL --> layers · <!-- THEME_TOTAL --> themes</p>
        <h1 class="page-title">All layers</h1>
        <!-- USAGE_BLOCK -->
        <label class="layers-search">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="catalog-search" class="catalog-search" aria-label="Filter layers" placeholder="Filter by name, place or source" autocomplete="off" />
        </label>
        <p class="search-meta" id="search-meta" aria-live="polite"></p>
      </div>
      <div class="layers-body">
        <nav class="theme-index" aria-label="Themes">
          <!-- THEME_INDEX -->
        </nav>
        <div>
          <p class="catalog-empty" id="catalog-empty" aria-live="polite" hidden></p>
          <div class="catalog" id="catalog-grid">
            <!-- CATEGORY_SECTIONS -->
          </div>
        </div>
      </div>
    </main>
    <!-- FOOTER -->
    <script type="module" src="/src/layers.ts"></script>
  </body>
</html>
