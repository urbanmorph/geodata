<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- SEO_HEAD -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F3F6F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <style>
      <!-- TOKENS -->
      .crumbs { margin: 0 0 var(--sp-3); font: 600 var(--fs-sm) var(--font-mono); }
      .crumbs a { color: var(--muted); }
      .rel-hash { overflow-wrap: anywhere; word-break: break-all; }
      .prose .rel-files { margin: var(--sp-2) 0 0; }
      .prose .rel-files > li { padding: var(--sp-2) 0 var(--sp-2) var(--sp-5); border-bottom: var(--border-line); }
      .prose .rel-files > li:last-child { border-bottom: 0; }
      .rel-files .rel-name { font-weight: 700; overflow-wrap: anywhere; }
      .rel-files .rel-sub { display: block; color: var(--muted); font-size: var(--fs-sm); }
      .rel-links { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); font: var(--fs-sm) var(--font-mono); }
      .prose .pairs > li > span:not(.k) { min-width: 0; overflow-wrap: anywhere; }
    </style>
  </head>
  <body class="page">
    <!-- NAV -->
    <main id="main" class="prose sheet">
<!-- MAIN -->
    </main>

    <!-- FOOTER -->
  </body>
</html>
